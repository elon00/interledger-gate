name: Offline Settlement Invariant CI
on:
  push:
    branches: [main, 'audit/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax
        run: python -m compileall -q interledger_gate tests
      - name: Adversarial offline accounting regressions
        run: python -m unittest discover -s tests -p 'reality_battery.py' -v
      - name: Offline smoke check
        run: python -m tests.reality_check_harness
      - name: Rust formatting
        run: cargo fmt --check
      - name: Rust offline invariants
        run: cargo test
